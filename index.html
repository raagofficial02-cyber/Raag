<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================
   RAAG — DESIGN TOKENS (from DESIGN.md)
   ============================================================ */
:root{
  --bg-pure:#000000;
  --bg-canvas:#0a0a0a;
  --bg-surface-elevated:#121212;
  --bg-surface-subtle:#181818;
  --bg-surface-field:#141414;

  --text-primary:#ffffff;
  --text-secondary:#a3a3a3;
  --text-tertiary:#737373;
  --accent-stone:#e5e5e5;

  --border-hairline:rgba(255,255,255,0.12);
  --border-subtle:rgba(255,255,255,0.06);
  --border-focus:#ffffff;

  --state-sale:#ff3b30;
  --state-success:#34c759;

  --font-display:'Syne', sans-serif;
  --font-body:'Hanken Grotesk', sans-serif;
  --font-mono:'JetBrains Mono', monospace;

  --xs:0.25rem; --sm:0.5rem; --md:1rem; --lg:1.5rem;
  --xl:2rem; --xxl:3rem; --xxxl:4.5rem; --xxxxl:6rem;
  --gutter:1rem; --max-editorial:1440px; --drawer-width:440px;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{background:var(--bg-canvas); scroll-behavior:smooth;}
body{
  background:var(--bg-canvas);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:0.9375rem;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img,svg{display:block; max-width:100%;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
ul{list-style:none;}
input,textarea,select{font-family:inherit; background:none; border:none; color:inherit;}
:focus-visible{outline:1.5px solid #fff; outline-offset:2px;}

/* Type scale */
.t-display-hero{font-family:var(--font-display); font-weight:800; font-size:2.75rem; line-height:1.0; letter-spacing:-0.03em;}
@media(min-width:1024px){.t-display-hero{font-size:5rem; line-height:0.95; letter-spacing:-0.04em;}}
.t-headline-xl{font-family:var(--font-display); font-weight:700; font-size:1.875rem; line-height:1.1; letter-spacing:-0.02em;}
@media(min-width:1024px){.t-headline-xl{font-size:3rem; line-height:1.05; letter-spacing:-0.03em;}}
.t-headline-lg{font-family:var(--font-display); font-weight:700; font-size:1.5rem; line-height:1.2; letter-spacing:-0.02em;}
@media(min-width:1024px){.t-headline-lg{font-size:1.875rem;}}
.t-headline-md{font-family:var(--font-body); font-weight:600; font-size:1.25rem; line-height:1.3; letter-spacing:-0.01em;}
.t-body-lg{font-family:var(--font-body); font-weight:400; font-size:1.125rem; line-height:1.6;}
.t-body-md{font-family:var(--font-body); font-weight:400; font-size:0.9375rem; line-height:1.5;}
.t-body-sm{font-family:var(--font-body); font-weight:400; font-size:0.8125rem; line-height:1.4; letter-spacing:0.01em;}
.t-label-caps{font-family:var(--font-body); font-weight:600; font-size:0.75rem; line-height:1; letter-spacing:0.14em; text-transform:uppercase;}
.t-label-mono{font-family:var(--font-mono); font-weight:400; font-size:0.6875rem; line-height:1.2; letter-spacing:0.08em;}
.t-price{font-family:var(--font-mono); font-weight:500; font-size:1rem; line-height:1.2; letter-spacing:0.02em;}

.container{max-width:var(--max-editorial); margin:0 auto; padding:0 var(--gutter);}
@media(min-width:1024px){.container{padding:0 2rem;}}

/* ============================================================
   NAVBAR
   ============================================================ */
.navbar{
  position:fixed; top:0; left:0; right:0; z-index:500;
  height:64px;
  background:rgba(10,10,10,0.85);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border-subtle);
  display:flex; align-items:center;
}
.nav-inner{
  width:100%; max-width:var(--max-editorial); margin:0 auto;
  padding:0 var(--gutter);
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
}
@media(min-width:1024px){.nav-inner{padding:0 2rem;}}
.nav-left,.nav-right{display:flex; align-items:center; gap:var(--xl); height:100%;}
.nav-right{justify-content:flex-end; gap:var(--lg);}
.nav-left{display:none;}
@media(min-width:1024px){.nav-left{display:flex;}}
.nav-link{font-family:var(--font-body); font-weight:600; font-size:0.75rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-primary); position:relative; padding:4px 0;}
.nav-link::after{content:''; position:absolute; left:0; right:100%; bottom:-2px; height:1px; background:#fff; transition:right 220ms ease-out;}
.nav-link:hover::after{right:0;}
.nav-logo{height:22px; display:flex; align-items:center; justify-content:center;}
.nav-logo img{height:22px; width:auto;}
.nav-icon-btn{background:none; border:none; color:var(--text-primary); display:flex; align-items:center; justify-content:center; width:32px; height:32px; position:relative;}
.nav-icon-btn svg{width:19px; height:19px;}
.cart-badge{
  position:absolute; top:-2px; right:-6px;
  font-family:var(--font-mono); font-size:0.625rem;
  background:#fff; color:#000; min-width:16px; height:16px; padding:0 3px;
  display:flex; align-items:center; justify-content:center;
}
.hamburger{display:flex; background:none; border:none; color:#fff; width:32px; height:32px; align-items:center; justify-content:center;}
@media(min-width:1024px){.hamburger{display:none;}}
.nav-right .desktop-only{display:none;}
@media(min-width:1024px){.nav-right .desktop-only{display:flex;}}

/* Mobile menu */
.mobile-menu{
  position:fixed; inset:0; z-index:600;
  background:var(--bg-pure);
  transform:translateX(100%); transition:transform 280ms ease-out;
  display:flex; flex-direction:column;
  padding:var(--xl) var(--gutter);
}
.mobile-menu.open{transform:translateX(0);}
.mobile-menu-top{display:flex; justify-content:flex-end; margin-bottom:var(--xxxl);}
.mobile-menu ul{display:flex; flex-direction:column; gap:var(--xl);}
.mobile-menu a{font-family:var(--font-display); font-weight:700; font-size:1.875rem;}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  height:44px; padding:0 1.75rem;
  font-family:var(--font-body); font-weight:600; font-size:0.75rem;
  letter-spacing:0.1em; text-transform:uppercase;
  border-radius:0; border:1px solid transparent;
  transition:background 220ms ease-out, color 220ms ease-out, border-color 220ms ease-out, box-shadow 220ms ease-out;
  white-space:nowrap;
}
@media(min-width:1024px){.btn{height:48px;}}
.btn-primary{background:#fff; color:#000;}
.btn-primary:hover{background:#e5e5e5; box-shadow:0 0 0 1px #fff;}
.btn-primary:disabled{background:#3a3a3a; color:#777; cursor:not-allowed; box-shadow:none;}
.btn-secondary{background:var(--bg-canvas); border-color:rgba(255,255,255,0.3); color:#fff;}
.btn-secondary:hover{background:#fff; color:#000;}
.btn-block{width:100%;}
.btn-link{height:auto; padding:0; font-size:0.8125rem; letter-spacing:0.02em; text-transform:none; border-bottom:1px solid #fff; padding-bottom:2px;}

/* ============================================================
   PRODUCT CARD
   ============================================================ */
.product-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--md);}
@media(min-width:768px){.product-grid{grid-template-columns:repeat(2,1fr); gap:var(--lg);}}
@media(min-width:1024px){.product-grid{grid-template-columns:repeat(4,1fr); gap:var(--lg);}}
.product-grid.pg-3{}
.product-card{display:block; cursor:pointer;}
.product-media{
  position:relative; aspect-ratio:4/5; background:var(--bg-surface-elevated);
  overflow:hidden; border:1px solid var(--border-subtle);
}
.product-media .ph-base, .product-media .ph-alt{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  transition:opacity 300ms ease-out;
}
.product-media .ph-alt{opacity:0;}
.product-card:hover .ph-alt{opacity:1;}
.product-card:hover .ph-base{opacity:0;}
.badge{
  position:absolute; top:var(--sm); left:var(--sm);
  font-family:var(--font-mono); font-size:0.625rem; letter-spacing:0.08em;
  padding:4px 8px; border:1px solid rgba(255,255,255,0.2); background:rgba(10,10,10,0.7);
  text-transform:uppercase;
}
.badge.sale{color:var(--state-sale); border-color:rgba(255,59,48,0.4);}
.product-meta{padding-top:var(--sm);}
.product-title{font-family:var(--font-body); font-weight:500; font-size:0.9375rem; text-transform:uppercase; letter-spacing:0.02em;}
.product-cat{color:var(--text-tertiary); font-size:0.8125rem; margin-top:2px;}
.product-price{font-family:var(--font-mono); font-size:0.9375rem; margin-top:var(--xs);}

/* placeholder garment art */
.garment-svg{width:42%; opacity:0.9;}
.garment-svg path,.garment-svg line{stroke:rgba(255,255,255,0.55); fill:none; stroke-width:1.2;}

/* ============================================================
   SECTIONS / LAYOUT
   ============================================================ */
.page{padding-top:64px;}
.section{padding:var(--xxl) 0;}
@media(min-width:1024px){.section{padding:var(--xxxl) 0;}}
.hairline-top{border-top:1px solid var(--border-hairline);}
.eyebrow{color:var(--text-tertiary);}

/* HERO */
.hero{
  position:relative; height:88vh; min-height:560px; max-height:900px;
  display:flex; align-items:flex-end;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.75) 100%),
    radial-gradient(120% 90% at 50% 10%, #232323 0%, #0a0a0a 62%);
  border-bottom:1px solid var(--border-hairline);
  overflow:hidden;
}
.hero-logo-mark{position:absolute; top:14%; left:50%; transform:translateX(-50%); width:120px; opacity:0.9;}
.hero-content{position:relative; z-index:2; padding:0 var(--gutter) var(--xxl); width:100%;}
@media(min-width:1024px){.hero-content{padding:0 2rem var(--xxxl);}}
.hero-cta-row{display:flex; flex-direction:column; gap:var(--sm); margin-top:var(--lg); max-width:420px;}
@media(min-width:520px){.hero-cta-row{flex-direction:row;}}

/* Editorial / lookbook */
.lookbook-grid{display:grid; grid-template-columns:1fr; gap:var(--md);}
@media(min-width:768px){.lookbook-grid{grid-template-columns:1fr 1fr;}}
.lookbook-block{aspect-ratio:4/5; background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); position:relative; overflow:hidden;}
.lookbook-block.tall{aspect-ratio:3/4;}

.brand-statement{max-width:640px;}

/* Final CTA */
.final-cta{
  background:radial-gradient(80% 120% at 50% 100%, #1a1a1a 0%, #050505 70%);
  text-align:center; padding:var(--xxxxl) var(--gutter);
  border-top:1px solid var(--border-hairline);
}

footer{border-top:1px solid var(--border-hairline); padding:var(--xxl) 0 var(--xl); background:var(--bg-pure);}
.footer-grid{display:grid; gap:var(--xl); grid-template-columns:1fr;}
@media(min-width:768px){.footer-grid{grid-template-columns:2fr 1fr 1fr 1fr;}}
.footer-logo{height:20px; margin-bottom:var(--md);}
.footer-col h4{margin-bottom:var(--md);}
.footer-col a,.footer-col p{display:block; color:var(--text-secondary); margin-bottom:var(--sm); font-size:0.8125rem;}
.footer-bottom{display:flex; flex-direction:column; gap:var(--sm); margin-top:var(--xxl); padding-top:var(--lg); border-top:1px solid var(--border-subtle); color:var(--text-tertiary); font-size:0.75rem;}
@media(min-width:768px){.footer-bottom{flex-direction:row; justify-content:space-between;}}

/* ============================================================
   CART DRAWER
   ============================================================ */
.drawer-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px);
  z-index:700; opacity:0; pointer-events:none; transition:opacity 260ms ease-out;
}
.drawer-backdrop.open{opacity:1; pointer-events:auto;}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:100vw; z-index:701;
  background:#0f0f0f; border-left:1px solid rgba(255,255,255,0.15);
  transform:translateX(100%); transition:transform 280ms ease-out;
  display:flex; flex-direction:column;
}
@media(min-width:640px){.drawer{width:var(--drawer-width);}}
.drawer.open{transform:translateX(0);}
.drawer-header{display:flex; align-items:center; justify-content:space-between; padding:var(--lg) var(--gutter); border-bottom:1px solid var(--border-hairline);}
.drawer-close{background:none; border:none; color:#fff; font-size:1.5rem; line-height:1; width:32px; height:32px;}
.drawer-body{flex:1; overflow-y:auto; padding:0 var(--gutter);}
.drawer-empty{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; gap:var(--md); padding:var(--xl);}
.cart-line{display:grid; grid-template-columns:76px 1fr; gap:var(--md); padding:var(--lg) 0; border-bottom:1px solid var(--border-subtle);}
.cart-line-thumb{width:76px; height:96px; background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:center;}
.cart-line-thumb svg{width:50%;}
.cart-line-info{display:flex; flex-direction:column; gap:2px;}
.cart-line-top{display:flex; justify-content:space-between; gap:var(--sm);}
.cart-line-variant{color:var(--text-tertiary); font-size:0.8125rem;}
.qty-stepper{display:flex; align-items:center; border:1px solid var(--border-hairline); width:fit-content; margin-top:var(--sm);}
.qty-stepper button{width:26px; height:26px; background:none; border:none; color:#fff; font-family:var(--font-mono);}
.qty-stepper span{font-family:var(--font-mono); font-size:0.75rem; min-width:24px; text-align:center;}
.cart-line-remove{color:var(--text-tertiary); font-size:0.75rem; text-decoration:underline; margin-top:var(--sm); background:none; border:none; text-align:left; width:fit-content;}
.cart-line-remove:hover{color:#fff;}
.drawer-footer{border-top:1px solid var(--border-hairline); padding:var(--lg) var(--gutter); background:#0c0c0c;}
.summary-row{display:flex; justify-content:space-between; font-size:0.8125rem; color:var(--text-secondary); margin-bottom:var(--sm);}
.summary-row.total{color:#fff; font-family:var(--font-mono); font-size:1rem; margin-top:var(--sm); padding-top:var(--sm); border-top:1px solid var(--border-subtle);}

/* ============================================================
   FORMS
   ============================================================ */
.field{margin-bottom:var(--lg);}
.field label{display:block; font-size:0.75rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-secondary); margin-bottom:var(--sm);}
.field input,.field textarea,.field select{
  width:100%; background:var(--bg-surface-field); border:1px solid rgba(255,255,255,0.15);
  padding:0 var(--md); height:48px; color:#fff; font-size:0.9375rem;
}
.field textarea{padding:var(--md); height:auto; min-height:100px; resize:vertical;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#fff;}
.field.error input,.field.error textarea{border-color:var(--state-sale);}
.field-error-msg{color:var(--state-sale); font-size:0.75rem; margin-top:4px;}
.field-row{display:grid; grid-template-columns:1fr; gap:var(--md);}
@media(min-width:640px){.field-row{grid-template-columns:1fr 1fr;}}
.checkbox-row{display:flex; align-items:center; gap:var(--sm);}
.sq-check{width:18px; height:18px; border:1px solid rgba(255,255,255,0.35); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:none;}
.sq-check.checked{background:#fff;}
.sq-check.checked::after{content:''; width:8px; height:8px; background:#000;}

/* Size chips */
.size-chip-row{display:flex; gap:var(--sm); flex-wrap:wrap;}
.size-chip{
  min-width:44px; height:44px; padding:0 12px; border:1px solid rgba(255,255,255,0.25);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:0.8125rem;
  background:none; color:#fff;
}
.size-chip.active{background:#fff; color:#000; border-color:#fff;}
.size-chip.disabled{opacity:0.3; text-decoration:line-through; cursor:not-allowed;}

/* Accordion */
.accordion-item{border-top:1px solid var(--border-hairline);}
.accordion-item:last-child{border-bottom:1px solid var(--border-hairline);}
.accordion-trigger{width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:none; color:#fff; padding:var(--md) 0; font-family:var(--font-body); font-weight:600; font-size:0.875rem; letter-spacing:0.02em; text-transform:uppercase;}
.accordion-panel{max-height:0; overflow:hidden; transition:max-height 260ms ease-out;}
.accordion-panel-inner{padding-bottom:var(--md); color:var(--text-secondary); font-size:0.875rem; line-height:1.6;}
.accordion-item.open .accordion-panel{max-height:400px;}
.accordion-icon{transition:transform 220ms ease-out;}
.accordion-item.open .accordion-icon{transform:rotate(45deg);}

/* Product detail */
.pdp-grid{display:grid; grid-template-columns:1fr; gap:var(--xl);}
@media(min-width:1024px){.pdp-grid{grid-template-columns:1.1fr 0.9fr; gap:var(--xxxl);}}
.pdp-gallery-main{aspect-ratio:4/5; background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:center; position:relative;}
.pdp-thumbs{display:flex; gap:var(--sm); margin-top:var(--sm);}
.pdp-thumb{width:64px; height:80px; background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:center; opacity:0.5;}
.pdp-thumb.active{opacity:1; border-color:#fff;}
.pdp-info{padding-top:var(--sm);}

/* Empty state generic */
.empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; gap:var(--md); padding:var(--xxxl) var(--gutter);}

/* Toast */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#fff; color:#000; padding:12px 20px; font-size:0.8125rem; font-weight:600;
  letter-spacing:0.04em; z-index:900; opacity:0; pointer-events:none; transition:all 240ms ease-out;
  text-transform:uppercase; font-family:var(--font-body);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* Admin */
.admin-shell{display:grid; grid-template-columns:1fr; min-height:calc(100vh - 64px);}
@media(min-width:900px){.admin-shell{grid-template-columns:260px 1fr;}}
.admin-sidebar{background:#080808; border-right:1px solid var(--border-subtle); padding:var(--lg) 0; display:none;}
@media(min-width:900px){.admin-sidebar{display:block;}}
.admin-tabs-mobile{display:flex; overflow-x:auto; gap:var(--md); padding:var(--md) var(--gutter); border-bottom:1px solid var(--border-hairline);}
@media(min-width:900px){.admin-tabs-mobile{display:none;}}
.admin-nav-item{
  display:flex; align-items:center; gap:var(--sm); padding:var(--sm) var(--lg);
  font-family:var(--font-mono); font-size:0.75rem; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--text-secondary); border-left:2px solid transparent; white-space:nowrap;
}
.admin-nav-item.active{color:#fff; border-left-color:#fff; background:rgba(255,255,255,0.03);}
.admin-main{padding:var(--lg) var(--gutter);}
@media(min-width:1024px){.admin-main{padding:var(--xl) var(--xl);}}
.admin-stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--md); margin-bottom:var(--xl);}
@media(min-width:768px){.admin-stat-grid{grid-template-columns:repeat(4,1fr);}}
.admin-stat-card{background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); padding:var(--lg);}
.admin-stat-value{font-family:var(--font-mono); font-size:1.5rem; margin-top:var(--xs);}
.admin-table-wrap{overflow-x:auto; border:1px solid var(--border-subtle);}
table.admin-table{width:100%; border-collapse:collapse; min-width:640px;}
.admin-table th{text-align:left; font-family:var(--font-mono); font-size:0.6875rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-tertiary); padding:var(--sm) var(--md); border-bottom:1px solid var(--border-hairline); background:var(--bg-canvas);}
.admin-table td{padding:var(--md); border-bottom:1px solid rgba(255,255,255,0.06); font-size:0.8125rem;}
.admin-table tr:hover td{background:#141414;}
.status-pill{font-family:var(--font-mono); font-size:0.6875rem; padding:3px 8px; border:1px solid var(--border-hairline); text-transform:uppercase; display:inline-block;}
.admin-section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--lg); flex-wrap:wrap; gap:var(--md);}

/* Login */
.auth-box{max-width:400px; margin:0 auto;}
.oauth-btn{display:flex; align-items:center; justify-content:center; gap:var(--sm); width:100%; height:48px; border:1px solid rgba(255,255,255,0.2); background:none; color:#fff; margin-bottom:var(--sm); font-size:0.8125rem; letter-spacing:0.02em;}
.oauth-btn:hover{border-color:#fff;}
.divider-row{display:flex; align-items:center; gap:var(--md); margin:var(--xl) 0; color:var(--text-tertiary); font-size:0.75rem;}
.divider-row::before,.divider-row::after{content:''; flex:1; height:1px; background:var(--border-hairline);}

/* Utility */
.mt-xs{margin-top:var(--xs);} .mt-sm{margin-top:var(--sm);} .mt-md{margin-top:var(--md);}
.mt-lg{margin-top:var(--lg);} .mt-xl{margin-top:var(--xl);} .mt-xxl{margin-top:var(--xxl);}
.mb-sm{margin-bottom:var(--sm);} .mb-md{margin-bottom:var(--md);} .mb-lg{margin-bottom:var(--lg);}
.text-secondary{color:var(--text-secondary);}
.text-tertiary{color:var(--text-tertiary);}
.flex-between{display:flex; justify-content:space-between; align-items:center;}
.hidden{display:none !important;}
.center-text{text-align:center;}
.spinner{width:22px; height:22px; border:2px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.skeleton{background:linear-gradient(90deg,#141414 25%,#1c1c1c 37%,#141414 63%); background-size:400% 100%; animation:sk 1.4s ease infinite;}
@keyframes sk{0%{background-position:100% 0;} 100%{background-position:0 0;}}

/* Search Overlay */
.search-backdrop {
  position:fixed; inset:0; background:rgba(0,0,0,0.9); backdrop-filter:blur(8px);
  z-index:700; opacity:0; pointer-events:none; transition:opacity 260ms ease-out;
  display:flex; flex-direction:column; padding:var(--xxxl) var(--gutter);
}
.search-backdrop.open { opacity:1; pointer-events:auto; }
.search-input {
  background:none; border:none; border-bottom:2px solid rgba(255,255,255,0.3); color:#fff; font-size:1.5rem; font-family:var(--font-display);
  width:100%; max-width:640px; margin:0 auto; padding:var(--sm) 0; outline:none; transition:border-color 200ms;
}
@media(min-width:768px){.search-input{font-size:2rem;}}
.search-input:focus { border-color:#fff; outline:none; }
.search-close {
  position:absolute; top:16px; right:16px; background:none; border:none; color:#fff; font-size:2rem; cursor:pointer; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
}
.search-results {
  max-width:640px; margin:var(--xl) auto 0; width:100%; overflow-y:auto;
}
.search-result-item {
  display:flex; align-items:center; gap:var(--md); padding:var(--md) 0; border-bottom:1px solid var(--border-subtle); color:#fff; transition:background 200ms;
}
.search-result-item:hover { background:rgba(255,255,255,0.03); }
.search-result-thumb {
  width:60px; height:75px; background:var(--bg-surface-elevated); display:flex; align-items:center; justify-content:center; border:1px solid var(--border-subtle); flex-shrink:0;
}
.search-result-thumb svg { width:50%; }
</style>
</head>

<!-- ============================================================
     MAIN APP ROOT
     ============================================================ -->
<main id="app" class="page"></main>

<!-- ============================================================
     SEARCH OVERLAY
     ============================================================ -->

<!-- ============================================================
     CART DRAWER
     ============================================================ -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>

  <div class="drawer-footer" id="drawerFooter"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   RAAG — DATA LAYER
   Kept separate from rendering so a backend / Shopify can
   replace this section later without touching UI code.
   ============================================================ */

let STORE_CONFIG = {
  name: "RAAG",
  whatsapp: "923133968029", // international format, no + or leading 0
  whatsappDisplay: "0313-3968029",
  instagram: "@raag__official",
  instagramUrl: "https://instagram.com/raag__official",
  deliveryCharge: 350,
  currency: "Rs."
};
try {
  const savedConfig = localStorage.getItem("raag_config");
  if(savedConfig) STORE_CONFIG = JSON.parse(savedConfig);
} catch(e){}

function saveConfig() {
  try { localStorage.setItem("raag_config", JSON.stringify(STORE_CONFIG)); } catch(e){}
}

// Simple inline garment glyphs used as image placeholders until
// real product photography is supplied. Swap PRODUCTS[i].images
// with real URLs later — rendering code does not need to change.
const GLYPHS = {
  jacket: `<svg class="garment-svg" viewBox="0 0 100 120"><path d="M30 10 L20 22 L28 30 L28 110 L72 110 L72 30 L80 22 L70 10 L58 16 L50 20 L42 16 Z"/><line x1="50" y1="20" x2="50" y2="108"/></svg>`,
  cargo: `<svg class="garment-svg" viewBox="0 0 100 120"><path d="M32 8 H68 L70 40 L74 112 H58 L52 55 L48 55 L42 112 H26 L30 40 Z"/><rect x="24" y="60" width="14" height="18"/><rect x="62" y="60" width="14" height="18"/></svg>`,
  hoodie: `<svg class="garment-svg" viewBox="0 0 100 120"><path d="M50 8 C34 8 30 20 30 28 L14 40 L22 58 L30 50 L30 112 H70 V50 L78 58 L86 40 L70 28 C70 20 66 8 50 8 Z"/><path d="M38 26 C38 36 62 36 62 26"/></svg>`
};

let PRODUCTS = [];
async function loadProducts() {
  try {
    const res = await fetch('/api/products');
    if (res.ok) PRODUCTS = await res.json();
  } catch (e) {
    console.error("Failed to load products", e);
  }
}


function getProduct(id){ return PRODUCTS.find(p => p.id === id); }
function formatPrice(n){ return STORE_CONFIG.currency + " " + n.toLocaleString("en-PK"); }

/* ============================================================
   IMAGE HELPERS
   ============================================================ */
function getProductMediaBase(p) {
  return (p.images && p.images.length > 0) ? `<img src="${p.images[0]}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover;" />` : p.glyph;
}
function getProductMediaAlt(p) {
  const src = (p.images && p.images.length > 1) ? p.images[1] : (p.images && p.images.length > 0 ? p.images[0] : null);
  return src ? `<img src="${src}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover;" />` : p.glyph;
}
function getProductMediaCart(p) {
  return (p.images && p.images.length > 0) ? `<img src="${p.images[0]}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover;" />` : p.glyph;
}
function getProductMediaMainPdp(p) {
  return (p.images && p.images.length > 0) ? `<img src="${p.images[0]}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover;" />` : `<div style="width:44%;">${p.glyph}</div>`;
}
function getProductMediaThumbPdp(p, idx) {
  if (p.images && p.images.length > idx) {
    return `<img src="${p.images[idx]}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover;" />`;
  }
  return `<div style="width:50%; ${idx===1?'opacity:0.6;':''}">${p.glyph}</div>`;
}

/* ============================================================
   CART STATE
   ============================================================ */
let cart = [];
try {
  const savedCart = localStorage.getItem("raag_cart");
  if(savedCart) cart = JSON.parse(savedCart);
} catch(e){}

function saveCart() {
  try { localStorage.setItem("raag_cart", JSON.stringify(cart)); } catch(e){}
}

function addToCart(productId, size, qty){
  const existing = cart.find(l => l.productId === productId && l.size === size);
  if(existing){ existing.qty += qty; }
  else { cart.push({ productId, size, qty }); }
  saveCart();
  renderCartBadge();
  renderDrawer();
  showToast("Added to Bag");
}
function updateQty(productId, size, delta){
  const line = cart.find(l => l.productId === productId && l.size === size);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0){ removeFromCart(productId, size); return; }
  saveCart();
  renderCartBadge(); renderDrawer(); if(currentRoute === "/cart") render();
}
function removeFromCart(productId, size){
  cart = cart.filter(l => !(l.productId === productId && l.size === size));
  saveCart();
  renderCartBadge(); renderDrawer(); if(currentRoute === "/cart") render();
}
function cartCount(){ return cart.reduce((s,l)=>s+l.qty,0); }
function cartSubtotal(){ return cart.reduce((s,l)=>{ const p = getProduct(l.productId); return s + (p ? p.price*l.qty : 0); },0); }

function renderCartBadge(){
  document.getElementById("cartBadge").textContent = cartCount();
}

/* ============================================================
   ORDER LOGIC
   ============================================================ */
let lastOrder = null;

function generateOrderId(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  const rand = String(Math.floor(1000 + Math.random()*9000));
  return `RAAG-${y}${m}${day}-${rand}`;
}

function buildWhatsAppMessage(order){
  let lines = [];
  lines.push("RAAG NEW ORDER");
  lines.push("");
  lines.push(`Order ID: ${order.orderId}`);
  lines.push("");
  lines.push("Customer:");
  lines.push(`Name: ${order.customerName}`);
  lines.push(`Phone: ${order.phone}`);
  if(order.email) lines.push(`Email: ${order.email}`);
  lines.push("");
  lines.push("Order:");
  order.items.forEach(item=>{
    const p = getProduct(item.productId);
    lines.push("");
    lines.push(p.name);
    lines.push(`Size: ${item.size}`);
    lines.push(`Quantity: ${item.qty}`);
    lines.push(`Price: ${formatPrice(p.price)}`);
  });
  lines.push("");
  lines.push("Delivery:");
  lines.push(formatPrice(order.deliveryCharges));
  lines.push("");
  lines.push("Total:");
  lines.push(formatPrice(order.total));
  lines.push("");
  lines.push("Shipping Address:");
  lines.push(order.address);
  lines.push(order.city);
  lines.push(order.province);
  if(order.postalCode) lines.push(order.postalCode);
  lines.push("");
  lines.push("Payment:");
  lines.push("Cash on Delivery");
  return lines.join("\n");
}

function buildWhatsAppUrl(order){
  const msg = buildWhatsAppMessage(order);
  return `https://wa.me/${STORE_CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
}

/* ============================================================
   ROUTER
   ============================================================ */
let currentRoute = "/";
let routeParam = null;

function parseHash(){
  let h = window.location.hash.replace(/^#/, "");
  if(!h) h = "/";
  const parts = h.split("/").filter(Boolean);
  return parts;
}

function navigate(){
  const parts = parseHash();
  window.scrollTo(0,0);
  if(parts.length === 0){ currentRoute = "/"; routeParam = null; }
  else if(parts[0] === "product"){ currentRoute = "/product"; routeParam = parts[1]; }
  else if(parts[0] === "admin"){
    if(!adminAuthed){
      window.location.hash = "#/login";
      return; // hashchange will re-trigger navigate() for /login
    }
    currentRoute = "/admin"; routeParam = parts[1] || "dashboard";
  }
  else { currentRoute = "/" + parts[0]; routeParam = parts[1] || null; }
  closeMobileMenu();
  render();
}
window.addEventListener("hashchange", navigate);

/* ============================================================
   SMALL UI HELPERS
   ============================================================ */
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove("show"), 1800);
}

function openDrawer(){
  document.getElementById("cartDrawer").classList.add("open");
  document.getElementById("drawerBackdrop").classList.add("open");
  renderDrawer();
}
function closeDrawer(){
  document.getElementById("cartDrawer").classList.remove("open");
  document.getElementById("drawerBackdrop").classList.remove("open");
}
function openMobileMenu(){ document.getElementById("mobileMenu").classList.add("open"); }
function closeMobileMenu(){ document.getElementById("mobileMenu").classList.remove("open"); }

document.getElementById("cartBtn").addEventListener("click", openDrawer);
document.getElementById("drawerCloseBtn").addEventListener("click", closeDrawer);
document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);
document.getElementById("hamburgerBtn").addEventListener("click", openMobileMenu);
document.getElementById("mobileMenuClose").addEventListener("click", closeMobileMenu);
document.querySelectorAll(".mobile-link").forEach(a => a.addEventListener("click", closeMobileMenu));

function openSearch(){
  document.getElementById("searchBackdrop").classList.add("open");
  document.getElementById("searchInput").focus();
  renderSearchResults("");
}
function closeSearch(){
  document.getElementById("searchBackdrop").classList.remove("open");
  document.getElementById("searchInput").value = "";
}
function handleSearchInput(e){
  renderSearchResults(e.target.value);
}
function renderSearchResults(query){
  const q = query.toLowerCase().trim();
  const res = document.getElementById("searchResults");
  if(!q) { res.innerHTML = ""; return; }
  const matches = PRODUCTS.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
  if(matches.length === 0){
    res.innerHTML = `<p class="text-secondary t-body-md mt-md">No products found.</p>`;
    return;
  }
  res.innerHTML = matches.map(p => `
    <a href="#/product/${p.id}" class="search-result-item" onclick="closeSearch()">
      <div class="search-result-thumb">${getProductMediaCart(p)}</div>
      <div>
        <div class="t-body-md" style="text-transform:uppercase;">${p.name}</div>
        <div class="t-price mt-xs">${formatPrice(p.price)}</div>
      </div>
    </a>
  `).join("");
}

document.getElementById("searchBtn").addEventListener("click", openSearch);
document.getElementById("searchCloseBtn").addEventListener("click", closeSearch);

/* ============================================================
   DRAWER RENDER
   ============================================================ */
function renderDrawer(){
  document.getElementById("drawerTitle").textContent = `BAG // ${String(cartCount()).padStart(2,"0")} ITEMS`;
  const body = document.getElementById("drawerBody");
  const footer = document.getElementById("drawerFooter");

  if(cart.length === 0){
    body.innerHTML = `
      <div class="drawer-empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <p class="t-body-md text-secondary">Your bag is empty.</p>
        <a href="#/collection" class="btn btn-primary" onclick="closeDrawer()">Shop Collection</a>
      </div>`;
    footer.innerHTML = "";
    return;
  }

  body.innerHTML = cart.map(line=>{
    const p = getProduct(line.productId);
    return `
    <div class="cart-line">
      <div class="cart-line-thumb">${getProductMediaCart(p)}</div>
      <div class="cart-line-info">
        <div class="cart-line-top">
          <span class="t-body-sm" style="text-transform:uppercase;">${p.name}</span>
          <span class="t-price">${formatPrice(p.price * line.qty)}</span>
        </div>
        <span class="cart-line-variant">Size ${line.size}</span>
        <div class="qty-stepper">
          <button onclick="updateQty('${p.id}','${line.size}',-1)" aria-label="Decrease quantity">–</button>
          <span>${String(line.qty).padStart(2,"0")}</span>
          <button onclick="updateQty('${p.id}','${line.size}',1)" aria-label="Increase quantity">+</button>
        </div>
        <button class="cart-line-remove" onclick="removeFromCart('${p.id}','${line.size}')">Remove</button>
      </div>
    </div>`;
  }).join("");

  const subtotal = cartSubtotal();
  const delivery = STORE_CONFIG.deliveryCharge;
  const total = subtotal + delivery;
  footer.innerHTML = `
    <div class="summary-row"><span>Subtotal</span><span class="t-price">${formatPrice(subtotal)}</span></div>
    <div class="summary-row"><span>Delivery</span><span class="t-price">${formatPrice(delivery)}</span></div>
    <div class="summary-row total"><span>Total</span><span>${formatPrice(total)}</span></div>
    <a href="#/checkout" class="btn btn-primary btn-block mt-md" onclick="closeDrawer()">Checkout</a>
  `;
}

/* ============================================================
   SHARED COMPONENTS
   ============================================================ */
function productCard(p){
  const soldOut = p.soldOut;
  return `
  <a href="#/product/${p.id}" class="product-card">
    <div class="product-media">
      ${p.limited ? `<span class="badge">Limited</span>` : ""}
      ${soldOut ? `<span class="badge">Sold Out</span>` : ""}
      <div class="ph-base">${getProductMediaBase(p)}</div>
      <div class="ph-alt">${getProductMediaAlt(p)}</div>
    </div>
    <div class="product-meta">
      <div class="product-title">${p.name}</div>
      <div class="product-cat">${p.category}</div>
      <div class="product-price">${formatPrice(p.price)}${p.compareAt ? ` <span style="color:var(--text-tertiary); text-decoration:line-through; margin-left:6px;">${formatPrice(p.compareAt)}</span>` : ""}</div>
    </div>
  </a>`;
}

function siteFooter(){
  return `
  <footer>
    <div class="container">
      <div class="footer-grid">
        <div>
          <img class="footer-logo" src="${window.__logoSrc}" alt="RAAG" />
          <p class="t-body-sm text-secondary" style="max-width:280px;">Contemporary clothing built on restraint, structure and presence.</p>
        </div>
        <div class="footer-col">
          <h4 class="t-label-caps">Shop</h4>
          <a href="#/collection">Collection</a>
          <a href="#/top-sellers">Top Sellers</a>
        </div>
        <div class="footer-col">
          <h4 class="t-label-caps">Studio</h4>
          <a href="#/about">About</a>
          <a href="#/contact">Contact</a>
        </div>
        <div class="footer-col">
          <h4 class="t-label-caps">Connect</h4>
          <a href="${STORE_CONFIG.instagramUrl}" target="_blank" rel="noopener">Instagram</a>
          <a href="https://wa.me/${STORE_CONFIG.whatsapp}" target="_blank" rel="noopener">WhatsApp</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span>&copy; ${new Date().getFullYear()} RAAG. All rights reserved.</span>
        <span>Cash on delivery, across Pakistan.</span>
      </div>
    </div>
  </footer>`;
}

/* ============================================================
   PAGE RENDERERS
   ============================================================ */
function renderHome(){
  const featured = PRODUCTS;
  const bestSellers = PRODUCTS.filter(p=>p.bestSeller);
  return `
  <section class="hero">
    <img class="hero-logo-mark" src="${window.__logoSrc}" alt="" />
    <div class="hero-content">
      <div class="container">
        <p class="t-label-mono eyebrow mb-sm">DROP 004</p>
        <h1 class="t-display-hero">STRUCTURE<br/>OVER NOISE.</h1>
        <div class="hero-cta-row">
          <a href="#/collection" class="btn btn-primary">Shop Collection</a>
          <a href="#/about" class="btn btn-secondary">Explore RAAG</a>
        </div>
      </div>
    </div>
  </section>

  <section class="section container">
    <div class="flex-between mb-lg">
      <h2 class="t-headline-lg">Featured</h2>
      <a href="#/collection" class="btn-link t-body-sm">View All</a>

  <section class="section container hairline-top">

    </div>

  </section>

  <section class="section container hairline-top">
    <p class="t-label-mono eyebrow mb-sm">RAAG</p>
    <p class="t-headline-md brand-statement">We build clothes around structure, not trend — heavy fabrics, clean lines, and enough restraint to wear them for years, not seasons.</p>
  </section>

  <section class="section container hairline-top">
    <div class="lookbook-grid">
      <div class="lookbook-block tall"><div style="width:38%;">${GLYPHS.jacket}</div></div>
      <div class="lookbook-block tall" style="align-self:end;"><div style="width:38%;">${GLYPHS.hoodie}</div></div>
    </div>
  </section>

  <section class="final-cta">
    <p class="t-label-mono eyebrow mb-sm">ENTER RAAG</p>
    <h2 class="t-headline-xl mb-lg">Nothing extra.<br/>Nothing missing.</h2>
    <a href="#/collection" class="btn btn-primary">Explore Collection</a>

  `;
}

function renderCollectionLike(title, description, products){
  return `
  <section class="section container">

let pdpSelectedSize = null;
function selectSize(el, size){
  document.querySelectorAll("#sizeRow .size-chip").forEach(c=>c.classList.remove("active"));

  document.getElementById("sizeError").style.display = "none";
}
function pdpQtyChange(delta){
  const el = document.getElementById("pdpQty");
  let q = parseInt(el.dataset.qty,10) + delta;
  if(q < 1) q = 1;
  el.dataset.qty = q;
  el.querySelector("span").textContent = String(q).padStart(2,"0");
}
function toggleAccordion(e, id){
  e.preventDefault();
  document.getElementById(id).classList.toggle("open");
}
function handleAddToBag(productId, andCheckout){
  if(!pdpSelectedSize){
    document.getElementById("sizeError").style.display = "block";
    return;
  }
  const qty = parseInt(document.getElementById("pdpQty").dataset.qty,10);
  addToCart(productId, pdpSelectedSize, qty);
  if(!andCheckout) pdpSelectedSize = null;
}

async function handlePlaceOrder(e){
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());

  let hasError = false;
  ["customerName","phone","address","city","province"].forEach(name=>{
    const input = form.querySelector(`[name="${name}"]`);
    if(!data[name] || !data[name].trim()){
      hasError = true;
      input.style.borderColor = "var(--state-sale)";
    } else {
      input.style.borderColor = "";
    }
  });
  if(hasError){ showToast("Please fill in required fields"); return false; }

  const subtotal = cartSubtotal();
  const delivery = STORE_CONFIG.deliveryCharge;
  const order = {
    orderId: generateOrderId(),
    customerName: data.customerName.trim(),
    phone: data.phone.trim(),
    email: (data.email||"").trim(),
    address: data.address.trim(),
    city: data.city.trim(),
    province: data.province,
    postalCode: (data.postalCode||"").trim(),
    whatsapp: (data.whatsapp||"").trim(),
    notes: (data.notes||"").trim(),
    items: cart.map(l=>({productId:l.productId, size:l.size, qty:l.qty})),
    subtotal, deliveryCharges: delivery, total: subtotal+delivery,
    paymentMethod: "Cash on Delivery",
    createdAt: new Date().toISOString(),
    status: "New"
  };

  const btn = form.querySelector('button[type="submit"]');
  const prevText = btn.textContent;
  btn.textContent = "Placing Order...";
  btn.disabled = true;

  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(order)
    });
    
    if (!res.ok) throw new Error("API Error");

    lastOrder = order;
    cart = [];
    saveCart();
    renderCartBadge();
    window.location.hash = "#/checkout";
    render();
    window.open(buildWhatsAppUrl(order), "_blank");
  } catch (err) {
    btn.textContent = prevText;
    btn.disabled = false;
    showToast("Something went wrong. Please try again.");
  }
  
  return false;
}

function exportOrdersToExcel(){
  if(typeof XLSX === "undefined"){
    showToast("Export unavailable offline — needs an internet connection");
    return;
  }
  const rows = MOCK_ORDERS.map(o=>({
    "Order ID": o.id,
    "Customer": o.customerName || o.customer || "",
    "Phone": o.phone,
    "Email": o.email || "",
    "Address": o.address,
    "City": o.city,
    "Province": o.province,
    "Items": Array.isArray(o.items) ? o.items.map(i=>i.productId+' x'+i.qty).join(', ') : (o.items || ""),
    "Total": o.total,
    "Payment Method": o.paymentMethod || "Cash on Delivery",
    "Status": o.status,
    "Date": o.createdAt || o.date || ""
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [
    {wch:20},{wch:20},{wch:14},{wch:22},{wch:28},{wch:14},{wch:12},{wch:40},{wch:10},{wch:16},{wch:12},{wch:12}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Orders");
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `raag-orders-${stamp}.xlsx`);
}

async function updateOrderStatus(orderId, status) {
  const o = MOCK_ORDERS.find(x=>(x.orderId||x.id)===orderId);
  if(o) o.status = status;
  render();
  try {
    await fetch('/api/orders', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId, status })
    });
  } catch(e) {
    showToast("Failed to update status");
  }
}

let editingProductId = null;
function openAdminProductModal(id = null){
  editingProductId = id;
  let modal = document.getElementById("adminProductModal");
  let backdrop = document.getElementById("adminModalBackdrop");
  
  if(!modal) {
    document.body.insertAdjacentHTML('beforeend', `
      <div class="drawer-backdrop" id="adminModalBackdrop" style="z-index:800;" onclick="closeAdminModal()"></div>
      <div class="admin-modal" id="adminProductModal" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); width:calc(100% - 2rem); max-width:500px; z-index:801; display:none; flex-direction:column; padding:var(--lg);">
        <h2 class="t-headline-md mb-md" id="adminModalTitle">Edit Product</h2>
        <div class="field"><label>Name</label><input type="text" id="adminProdName" /></div>
        <div class="field-row">
          <div class="field"><label>Price (Rs.)</label><input type="number" id="adminProdPrice" /></div>
          <div class="field"><label>Status</label>
             <select id="adminProdStatus">
               <option value="active">Active</option>
               <option value="soldout">Sold Out</option>
             </select>
          </div>
        </div>
        <p class="t-body-sm text-tertiary mb-md mt-sm">Changes are saved locally for this session. Connect a backend to persist permanently.</p>
        <div style="display:flex; justify-content:flex-end; gap:var(--sm);">
          <button class="btn btn-secondary" onclick="closeAdminModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveAdminProduct()">Save Changes</button>
        </div>
      </div>
    `);
    modal = document.getElementById("adminProductModal");
    backdrop = document.getElementById("adminModalBackdrop");
  }
  
  backdrop.classList.add("open");
  modal.style.display = "flex";
  
  if(id){
    const p = getProduct(id);
    document.getElementById("adminModalTitle").textContent = "Edit Product";
    document.getElementById("adminProdName").value = p.name;
    document.getElementById("adminProdPrice").value = p.price;
    document.getElementById("adminProdStatus").value = p.soldOut ? "soldout" : "active";
  } else {
    document.getElementById("adminModalTitle").textContent = "Add Product";
    document.getElementById("adminProdName").value = "";
    document.getElementById("adminProdPrice").value = "";
    document.getElementById("adminProdStatus").value = "active";
  }
}

function closeAdminModal(){
  document.getElementById("adminModalBackdrop").classList.remove("open");
  document.getElementById("adminProductModal").style.display = "none";
}

let productToDelete = null;
function openDeleteProductModal(id) {
  productToDelete = id;
  if (!document.getElementById("deleteProductModal")) {
    document.body.insertAdjacentHTML('beforeend', `
      <div class="drawer-backdrop" id="deleteModalBackdrop" style="z-index:900;" onclick="closeDeleteProductModal()"></div>
      <div class="admin-modal" id="deleteProductModal" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); width:calc(100% - 2rem); max-width:400px; z-index:901; display:none; flex-direction:column; padding:var(--lg);">

          <button class="btn btn-secondary" onclick="closeDeleteProductModal()">Cancel</button>
          <button class="btn btn-primary" style="background:var(--state-sale);" onclick="confirmDeleteProduct()">Delete</button>
        </div>
      </div>
    `);
  }
  document.getElementById("deleteModalBackdrop").classList.add("open");
  document.getElementById("deleteProductModal").style.display = "flex";
}

function closeDeleteProductModal() {
  document.getElementById("deleteModalBackdrop").classList.remove("open");
  document.getElementById("deleteProductModal").style.display = "none";
}

async function confirmDeleteProduct() {
  if (!productToDelete) return;
  const res = await fetch('/api/products?id=' + productToDelete, { method: 'DELETE' });
  if (res.ok) {
    PRODUCTS = PRODUCTS.filter(p => p.id !== productToDelete);
    render();
    showToast("Product deleted");
  } else {
    showToast("Failed to delete product");
  }
  closeDeleteProductModal();
}

async function saveAdminProduct(){
  const name = document.getElementById("adminProdName").value;
  const price = parseInt(document.getElementById("adminProdPrice").value, 10);
  const soldOut = document.getElementById("adminProdStatus").value === "soldout";
  
  let p = null;
  let isEdit = false;
  
  if(editingProductId){
    p = getProduct(editingProductId);
    p.name = name || p.name;
    p.price = isNaN(price) ? p.price : price;
    p.soldOut = soldOut;
    isEdit = true;
  } else {
    const newId = "prod-" + Math.floor(Math.random()*10000);
    p = {
      id: newId,
      name: name || "New Product",
      category: "Category",
      price: isNaN(price) ? 0 : price,
      compareAt: null,
      glyph: GLYPHS.jacket,
      images: [],
      sizes: ["S","M","L"],
      outOfStockSizes: [],
      bestSeller: false,
      limited: false,
      soldOut: soldOut,
      edition: "NEW",
      description: "A new product added via prototype.",
      details: ["Detail 1"],
      sizeGuide: "Fits true to size.",
      shipping: "Standard shipping.",
      returns: "Standard returns."
    };
    PRODUCTS.unshift(p);
  }
  
  // Optimistically update UI
  closeAdminModal();
  render();
  
  // Call API
  try {
    const res = await fetch('/api/products', {
      method: isEdit ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(p)
    });
    if (!res.ok) throw new Error("API Error");
    showToast("Changes saved");
  } catch(e) {
    showToast("Failed to save product to database");
  }
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  const app = document.getElementById("app");
  let html = "";
  let showFooter = true;

  if(currentRoute === "/admin"){
    // handle nested /admin/order/:id
    const parts = parseHash();
    if(parts[1] === "order"){ routeParam = "order"; routeSubParam = parts[2]; }
    html = renderAdmin();
    showFooter = false;
  }
  else if(currentRoute === "/") html = renderHome();
  else if(currentRoute === "/collection") html = renderCollection();
  else if(currentRoute === "/top-sellers") html = renderTopSellers();
  else if(currentRoute === "/product") html = renderProduct(routeParam);
  else if(currentRoute === "/about") html = renderAbout();
  else if(currentRoute === "/contact") html = renderContact();
  else if(currentRoute === "/cart") html = renderCartPage();
  else if(currentRoute === "/checkout") html = renderCheckout();
  else if(currentRoute === "/login") html = renderLogin();
  else {
    html = `<section class="empty-state" style="min-height:60vh;"><h1 class="t-headline-lg">Page not found</h1><a href="#/" class="btn btn-primary">Back Home</a></section>`;
  }

  app.innerHTML = html + (showFooter ? siteFooter() : "");
  pdpSelectedSize = null;
}
