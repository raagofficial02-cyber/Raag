<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAAG — Timeless Clothing &amp; Quiet Luxury</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================
   RAAG — DESIGN TOKENS
   ============================================================ */
:root {
  --bg-pure: #000000;
  --bg-canvas: #0a0a0a;
  --bg-surface-elevated: #121212;
  --bg-surface-subtle: #181818;
  --bg-surface-field: #141414;

  --text-primary: #ffffff;
  --text-secondary: #a3a3a3;
  --text-tertiary: #737373;
  --accent-stone: #e5e5e5;

  --border-hairline: rgba(255,255,255,0.12);
  --border-subtle: rgba(255,255,255,0.06);
  --border-focus: #ffffff;

  --state-sale: #ff3b30;
  --state-success: #34c759;

  --font-display: 'Syne', sans-serif;
  --font-body: 'Hanken Grotesk', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --xs: 0.25rem; --sm: 0.5rem; --md: 1rem; --lg: 1.5rem;
  --xl: 2rem; --xxl: 3rem; --xxxl: 4.5rem; --xxxxl: 6rem;
  --gutter: 1rem; --max-editorial: 1440px; --drawer-width: 440px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg-canvas); scroll-behavior: smooth; overflow-x: hidden; }
body {
  background: var(--bg-canvas);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 0.9375rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
  max-width: 100%;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
ul { list-style: none; }
input, textarea, select { font-family: inherit; background: none; border: none; color: inherit; }
:focus-visible { outline: 1.5px solid #fff; outline-offset: 2px; }

/* Type scale */
.t-display-hero { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.1rem, 11vw, 2.75rem); line-height: 1.0; letter-spacing: -0.03em; }
@media(min-width:1024px){ .t-display-hero { font-size: 5rem; line-height: 0.95; letter-spacing: -0.04em; } }
.t-headline-xl { font-family: var(--font-display); font-weight: 700; font-size: 1.875rem; line-height: 1.1; letter-spacing: -0.02em; }
@media(min-width:1024px){ .t-headline-xl { font-size: 3rem; line-height: 1.05; letter-spacing: -0.03em; } }
.t-headline-lg { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.2; letter-spacing: -0.02em; }
@media(min-width:1024px){ .t-headline-lg { font-size: 1.875rem; } }
.t-headline-md { font-family: var(--font-body); font-weight: 600; font-size: 1.25rem; line-height: 1.3; letter-spacing: -0.01em; }
.t-body-lg { font-family: var(--font-body); font-weight: 400; font-size: 1.125rem; line-height: 1.6; }
.t-body-md { font-family: var(--font-body); font-weight: 400; font-size: 0.9375rem; line-height: 1.5; }
.t-body-sm { font-family: var(--font-body); font-weight: 400; font-size: 0.8125rem; line-height: 1.4; letter-spacing: 0.01em; }
.t-label-caps { font-family: var(--font-body); font-weight: 600; font-size: 0.75rem; line-height: 1; letter-spacing: 0.14em; text-transform: uppercase; }
.t-label-mono { font-family: var(--font-mono); font-weight: 400; font-size: 0.6875rem; line-height: 1.2; letter-spacing: 0.08em; }
.t-price { font-family: var(--font-mono); font-weight: 500; font-size: 1rem; line-height: 1.2; letter-spacing: 0.02em; }

.container { max-width: var(--max-editorial); margin: 0 auto; padding: 0 var(--gutter); }
@media(min-width:1024px){ .container { padding: 0 2rem; } }

/* ============================================================
   NAVBAR & BRANDING LOGO
   ============================================================ */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  height: 64px;
  background: rgba(10,10,10,0.88);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center;
}
.nav-inner {
  width: 100%; max-width: var(--max-editorial); margin: 0 auto;
  padding: 0 var(--gutter);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
}
@media(min-width:1024px){ .nav-inner { padding: 0 2rem; } }
.nav-left, .nav-right { display: flex; align-items: center; gap: var(--xl); height: 100%; }
.nav-right { justify-content: flex-end; gap: var(--lg); }
.nav-left { display: none; }
@media(min-width:1024px){ .nav-left { display: flex; } }
.nav-link {
  font-family: var(--font-body); font-weight: 600; font-size: 0.75rem;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-secondary);
  position: relative; padding: 4px 0; transition: color 200ms ease;
}
.nav-link::after {
  content: ''; position: absolute; left: 0; right: 100%; bottom: -2px; height: 1px;
  background: #fff; transition: right 220ms ease-out;
}
.nav-link:hover, .nav-link.active { color: var(--text-primary); }
.nav-link:hover::after, .nav-link.active::after { right: 0; }

.nav-logo-text {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.35rem;
  letter-spacing: 0.26em;
  color: var(--text-primary);
  text-transform: uppercase;
  user-select: none;
  transition: opacity 200ms ease;
}
.nav-logo-text:hover { opacity: 0.85; }

.nav-icon-btn {
  background: none; border: none; color: var(--text-primary);
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; position: relative;
}
.nav-icon-btn svg { width: 19px; height: 19px; }
.cart-badge {
  position: absolute; top: -2px; right: -6px;
  font-family: var(--font-mono); font-size: 0.625rem;
  background: #fff; color: #000; min-width: 16px; height: 16px; padding: 0 3px;
  display: flex; align-items: center; justify-content: center;
}
.hamburger {
  display: flex; background: none; border: none; color: #fff;
  width: 32px; height: 32px; align-items: center; justify-content: center;
}
@media(min-width:1024px){ .hamburger { display: none; } }
.nav-right .account-desktop { display: none; }
@media(min-width:1024px){ .nav-right .account-desktop { display: flex; align-items: center; gap: var(--lg); } }

/* Mobile menu */
.mobile-menu {
  position: fixed; inset: 0; z-index: 600;
  background: var(--bg-pure);
  transform: translateX(100%); transition: transform 280ms ease-out;
  display: flex; flex-direction: column;
  padding: var(--xl) var(--gutter);
}
.mobile-menu.open { transform: translateX(0); }
.mobile-menu-top { display: flex; justify-content: flex-end; margin-bottom: var(--xxxl); }
.mobile-menu ul { display: flex; flex-direction: column; gap: var(--xl); }
.mobile-menu a {
  font-family: var(--font-display); font-weight: 700; font-size: 1.875rem;
  color: var(--text-secondary); transition: color 200ms ease;
}
.mobile-menu a.active, .mobile-menu a:hover { color: var(--text-primary); }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 44px; padding: 0 1.75rem;
  font-family: var(--font-body); font-weight: 600; font-size: 0.75rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  border-radius: 0; border: 1px solid transparent;
  transition: background 220ms ease-out, color 220ms ease-out, border-color 220ms ease-out, box-shadow 220ms ease-out;
  white-space: nowrap;
}
@media(min-width:1024px){ .btn { height: 48px; } }
.btn-primary { background: #fff; color: #000; }
.btn-primary:hover { background: #e5e5e5; box-shadow: 0 0 0 1px #fff; }
.btn-primary:disabled { background: #3a3a3a; color: #777; cursor: not-allowed; box-shadow: none; }
.btn-secondary { background: var(--bg-canvas); border-color: rgba(255,255,255,0.3); color: #fff; }
.btn-secondary:hover { background: #fff; color: #000; }
.btn-block { width: 100%; }
.btn-link { height: auto; padding: 0; font-size: 0.8125rem; letter-spacing: 0.02em; text-transform: none; border-bottom: 1px solid #fff; padding-bottom: 2px; }

/* ============================================================
   PRODUCT CARDS & GRID
   ============================================================ */
.product-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media(min-width:480px){ .product-grid { gap: 16px; } }
@media(min-width:768px){ .product-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; } }
@media(min-width:1024px){ .product-grid { grid-template-columns: repeat(4, 1fr); gap: 28px; } }

.product-card { display: block; cursor: pointer; text-decoration: none; color: inherit; }
.product-media {
  position: relative; aspect-ratio: 4 / 5;
  background: radial-gradient(circle at 50% 35%, #222222 0%, #121212 60%, #060606 100%);
  overflow: hidden; border: 1px solid var(--border-subtle);
  transition: border-color 220ms ease;
}
.product-card:hover .product-media { border-color: rgba(255, 255, 255, 0.28); }
.product-media .ph-base, .product-media .ph-alt {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  transition: opacity 300ms ease-out;
}
.product-media .ph-alt { opacity: 0; }
.product-card:hover .ph-alt { opacity: 1; }
.product-card:hover .ph-base { opacity: 0; }

.garment-svg {
  width: 48%; max-height: 70%;
  opacity: 0.7; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.85));
  z-index: 2; position: relative;
  transition: transform 300ms ease, opacity 300ms ease;
}
.product-card:hover .garment-svg { transform: scale(1.04); opacity: 0.85; }

.badge {
  position: absolute; top: var(--sm); left: var(--sm); z-index: 5;
  font-family: var(--font-mono); font-size: 0.625rem; letter-spacing: 0.08em;
  padding: 4px 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(10,10,10,0.85);
  backdrop-filter: blur(4px); text-transform: uppercase; color: var(--text-primary);
}
.badge.sale { color: var(--state-sale); border-color: rgba(255,59,48,0.4); }
.product-meta { padding-top: var(--sm); }
.product-title {
  font-family: var(--font-body); font-weight: 500; font-size: 0.8125rem;
  letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
@media(min-width:768px){ .product-title { font-size: 0.875rem; } }
.product-cat { color: var(--text-tertiary); font-size: 0.75rem; margin-top: 2px; }
.product-price { font-family: var(--font-mono); font-weight: 500; font-size: 0.8125rem; margin-top: 4px; color: var(--accent-stone); }
@media(min-width:768px){ .product-price { font-size: 0.875rem; } }

/* ============================================================
   SECTIONS & HERO
   ============================================================ */
.page { padding-top: 64px; }
.section { padding: var(--xxl) 0; }
@media(min-width:1024px){ .section { padding: var(--xxxl) 0; } }
.hairline-top { border-top: 1px solid var(--border-hairline); }
.eyebrow { color: var(--text-tertiary); }

/* HERO — ATTACHED HERO IMAGE INTEGRATION (hero.jpg) */
.hero {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  min-height: 380px;
  max-height: 82vh;
  background-image: url('hero.jpg');
  background-size: cover;
  background-position: center right;
  border-bottom: 1px solid var(--border-hairline);
  overflow: hidden;
}
@media(max-width: 767px) {
  .hero {
    aspect-ratio: auto;
    height: 66vh;
    min-height: 360px;
    max-height: 520px;
    background-position: 68% center;
  }
}

/* Interactive hotspot overlay for the hero image CTA ("EXPLORE COLLECTION ->") */
.hero-cta-overlay {
  position: absolute;
  left: 6%;
  top: 60.5%;
  width: 17.5%;
  min-width: 160px;
  height: 9.5%;
  min-height: 44px;
  max-height: 54px;
  z-index: 10;
  cursor: pointer;
  background: transparent;
  border: 1px solid transparent;
  transition: all 220ms ease;
  outline: none;
}
.hero-cta-overlay:hover, .hero-cta-overlay:focus-visible {
  border-color: rgba(255, 255, 255, 0.4);
  background: rgba(255, 255, 255, 0.05);
  box-shadow: 0 0 16px rgba(255, 255, 255, 0.12);
}
@media(max-width: 767px) {
  .hero-cta-overlay {
    left: 5.5%;
    top: 58.5%;
    width: 48%;
    min-width: 140px;
    height: 44px;
  }
}

/* Editorial / lookbook */
.lookbook-grid { display: grid; grid-template-columns: 1fr; gap: var(--md); }
@media(min-width:768px){ .lookbook-grid { grid-template-columns: 1fr 1fr; } }
.lookbook-block { aspect-ratio: 4/5; background: #111; border: 1px solid var(--border-subtle); position: relative; overflow: hidden; }
.lookbook-block::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 40%, rgba(40,40,40,0.6) 0%, rgba(10,10,10,0.95) 80%);
  z-index: 1; pointer-events: none;
}
.lookbook-block::after {
  content: ""; position: absolute; inset: -50%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
  opacity: 0.9; mix-blend-mode: overlay; pointer-events: none; z-index: 2;
}
.lookbook-block.tall { aspect-ratio: 3/4; }
.brand-statement { max-width: 640px; }

/* Final CTA */
.final-cta {
  background: radial-gradient(80% 120% at 50% 100%, #1a1a1a 0%, #050505 70%);
  text-align: center; padding: var(--xxxxl) var(--gutter);
  border-top: 1px solid var(--border-hairline);
}

footer { border-top: 1px solid var(--border-hairline); padding: var(--xxl) 0 var(--xl); background: var(--bg-pure); }
.footer-grid { display: grid; gap: var(--xl); grid-template-columns: 1fr; }
@media(min-width:768px){ .footer-grid { grid-template-columns: 2fr 1fr 1fr 1fr; } }
.footer-col h4 { margin-bottom: var(--md); }
.footer-col a, .footer-col p { display: block; color: var(--text-secondary); margin-bottom: var(--sm); font-size: 0.8125rem; }
.footer-bottom { display: flex; flex-direction: column; gap: var(--sm); margin-top: var(--xxl); padding-top: var(--lg); border-top: 1px solid var(--border-subtle); color: var(--text-tertiary); font-size: 0.75rem; }
@media(min-width:768px){ .footer-bottom { flex-direction: row; justify-content: space-between; } }

/* ============================================================
   CART DRAWER
   ============================================================ */
.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
  z-index: 700; opacity: 0; pointer-events: none; transition: opacity 260ms ease-out;
}
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 100%; z-index: 701;
  background: #0f0f0f; border-left: 1px solid rgba(255,255,255,0.15);
  transform: translateX(100%); transition: transform 280ms ease-out;
  display: flex; flex-direction: column;
}
@media(min-width:640px){ .drawer { width: var(--drawer-width); } }
.drawer.open { transform: translateX(0); }
.drawer-header { display: flex; align-items: center; justify-content: space-between; padding: var(--lg) var(--gutter); border-bottom: 1px solid var(--border-hairline); }
.drawer-close { background: none; border: none; color: #fff; font-size: 1.5rem; line-height: 1; width: 32px; height: 32px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 0 var(--gutter); }
.drawer-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: var(--md); padding: var(--xl); }
.cart-line { display: grid; grid-template-columns: 76px 1fr; gap: var(--md); padding: var(--lg) 0; border-bottom: 1px solid var(--border-subtle); }
.cart-line-thumb { width: 76px; height: 96px; background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; }
.cart-line-thumb svg { width: 50%; }
.cart-line-info { display: flex; flex-direction: column; gap: 2px; }
.cart-line-top { display: flex; justify-content: space-between; gap: var(--sm); }
.cart-line-variant { color: var(--text-tertiary); font-size: 0.8125rem; }
.qty-stepper { display: flex; align-items: center; border: 1px solid var(--border-hairline); width: fit-content; margin-top: var(--sm); }
.qty-stepper button { width: 32px; height: 32px; background: none; border: none; color: #fff; font-family: var(--font-mono); }
.qty-stepper span { font-family: var(--font-mono); font-size: 0.75rem; min-width: 24px; text-align: center; }
.cart-line-remove { color: var(--text-tertiary); font-size: 0.75rem; text-decoration: underline; margin-top: var(--sm); background: none; border: none; text-align: left; width: fit-content; }
.cart-line-remove:hover { color: #fff; }
.drawer-footer { border-top: 1px solid var(--border-hairline); padding: var(--lg) var(--gutter); background: #0c0c0c; }
.summary-row { display: flex; justify-content: space-between; font-size: 0.8125rem; color: var(--text-secondary); margin-bottom: var(--sm); }
.summary-row.total { color: #fff; font-family: var(--font-mono); font-size: 1rem; margin-top: var(--sm); padding-top: var(--sm); border-top: 1px solid var(--border-subtle); }

/* ============================================================
   FORMS & CONTROLS
   ============================================================ */
.field { margin-bottom: var(--lg); }
.field label { display: block; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: var(--sm); }
.field input, .field textarea, .field select {
  width: 100%; background: var(--bg-surface-field); border: 1px solid rgba(255,255,255,0.15);
  padding: 0 var(--md); height: 48px; color: #fff; font-size: 16px;
}
.field textarea { padding: var(--md); height: auto; min-height: 100px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: #fff; }
.field.error input, .field.error textarea { border-color: var(--state-sale); }
.field-error-msg { color: var(--state-sale); font-size: 0.75rem; margin-top: 4px; }
.field-row { display: grid; grid-template-columns: 1fr; gap: var(--md); }
@media(min-width:640px){ .field-row { grid-template-columns: 1fr 1fr; } }
.checkbox-row { display: flex; align-items: center; gap: var(--sm); }

/* Size chips */
.size-chip-row { display: flex; gap: var(--sm); flex-wrap: wrap; }
.size-chip {
  min-width: 44px; height: 44px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.25);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.8125rem;
  background: none; color: #fff; transition: all 180ms ease;
}
.size-chip.active { background: #fff; color: #000; border-color: #fff; }
.size-chip.disabled { opacity: 0.3; text-decoration: line-through; cursor: not-allowed; }

/* Accordion */
.accordion-item { border-top: 1px solid var(--border-hairline); }
.accordion-item:last-child { border-bottom: 1px solid var(--border-hairline); }
.accordion-trigger { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: none; color: #fff; padding: var(--md) 0; font-family: var(--font-body); font-weight: 600; font-size: 0.875rem; letter-spacing: 0.02em; text-transform: uppercase; }
.accordion-panel { max-height: 0; overflow: hidden; transition: max-height 260ms ease-out; }
.accordion-panel-inner { padding-bottom: var(--md); color: var(--text-secondary); font-size: 0.875rem; line-height: 1.6; }
.accordion-item.open .accordion-panel { max-height: 400px; }
.accordion-icon { transition: transform 220ms ease-out; }
.accordion-item.open .accordion-icon { transform: rotate(45deg); }

/* Product detail */
.pdp-grid { display: grid; grid-template-columns: 1fr; gap: var(--xl); }
@media(min-width:1024px){ .pdp-grid { grid-template-columns: 1.1fr 0.9fr; gap: var(--xxxl); } }
.pdp-gallery-main { aspect-ratio: 4/5; background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.pdp-thumbs { display: flex; gap: var(--sm); margin-top: var(--sm); }
.pdp-thumb { width: 64px; height: 80px; background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; opacity: 0.5; cursor: pointer; transition: opacity 200ms, border-color 200ms; }
.pdp-thumb.active { opacity: 1; border-color: #fff; }
.pdp-info { padding-top: var(--sm); }

/* Empty state generic */
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--md); padding: var(--xxxl) var(--gutter); }

/* Toast */
.toast {
  position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%;
  transform: translateX(-50%) translateY(20px);
  width: min(420px, calc(100% - 32px));
  background: #fff; color: #000; padding: 12px 16px; font-size: 0.75rem; font-weight: 600;
  letter-spacing: 0.04em; z-index: 900; opacity: 0; pointer-events: none; transition: all 240ms ease-out;
  text-transform: uppercase; font-family: var(--font-body);
  text-align: center; white-space: normal; word-break: break-word; line-height: 1.35;
}

<script>
/* ============================================================

/* Enhanced Fashion Garment SVG Placeholders */

    <rect x="82" y="70" width="16" height="22" rx="1" fill="#121212" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" />

let PRODUCTS = [];
async function loadProducts() {
  try {
    const res = await fetch('/api/products');
    if (res.ok) PRODUCTS = await res.json();
  } catch (e) {
    console.error("Failed to load products", e);
  }
}

function getProduct(id){ return PRODUCTS.find(p => p.id === id); }
function formatPrice(n){ return STORE_CONFIG.currency + " " + (n || 0).toLocaleString("en-PK"); }

/* ============================================================
   IMAGE HELPERS — Display Real Photography or Refined Fallback
   ============================================================ */
function getProductMediaBase(p) {
  return (p && p.images && p.images.length > 0)
    ? `<img src="${p.images[0]}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover; object-position:center top;" loading="lazy" onerror="this.style.display='none'" />`
    : (p && p.glyph ? p.glyph : GLYPHS.jacket);
}
function getProductMediaAlt(p) {
  if (!p) return GLYPHS.jacket;
  const src = (p.images && p.images.length > 1) ? p.images[1] : (p.images && p.images.length > 0 ? p.images[0] : null);
  return src
    ? `<img src="${src}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover; object-position:center top;" loading="lazy" onerror="this.style.display='none'" />`
    : (p.glyph || GLYPHS.jacket);
}
function getProductMediaCart(p) {
  return (p && p.images && p.images.length > 0)
    ? `<img src="${p.images[0]}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover; object-position:center top;" loading="lazy" onerror="this.style.display='none'" />`
    : (p && p.glyph ? p.glyph : GLYPHS.jacket);
}
function getProductMediaMainPdp(p) {
  return (p && p.images && p.images.length > 0)
    ? `<img src="${p.images[0]}" id="pdpMainImage" alt="${p.name}" style="width:100%; height:100%; object-fit:cover; object-position:center top;" loading="lazy" onerror="this.style.display='none'" />`
    : `<div style="width:48%; display:flex; justify-content:center; align-items:center; height:100%;">${p.glyph || GLYPHS.jacket}</div>`;
}
function getProductMediaThumbPdp(p, idx) {
  if (p && p.images && p.images.length > idx) {
    return `<img src="${p.images[idx]}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover; object-position:center top;" loading="lazy" onerror="this.style.display='none'" />`;
  }
  return `<div style="width:50%; display:flex; justify-content:center; align-items:center; height:100%; ${idx===1?'opacity:0.6;':''}">${p ? p.glyph : GLYPHS.jacket}</div>`;
}

/* ============================================================
   CART STATE & FUNCTIONS
   ============================================================ */
let cart = [];
try {
  const savedCart = localStorage.getItem("raag_cart");
  if(savedCart) cart = JSON.parse(savedCart);
} catch(e){}

function saveCart() {
  try { localStorage.setItem("raag_cart", JSON.stringify(cart)); } catch(e){}
}

function addToCart(productId, size, qty){
  const existing = cart.find(l => l.productId === productId && l.size === size);
  if(existing){ existing.qty += qty; }
  else { cart.push({ productId, size, qty }); }
  saveCart();
  renderCartBadge();
  renderDrawer();
  showToast("Added to Bag");
}
function updateQty(productId, size, delta){
  const line = cart.find(l => l.productId === productId && l.size === size);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0){ removeFromCart(productId, size); return; }
  saveCart();
  renderCartBadge(); renderDrawer(); if(currentRoute === "/cart") render();
}
function removeFromCart(productId, size){
  cart = cart.filter(l => !(l.productId === productId && l.size === size));
  saveCart();
  renderCartBadge(); renderDrawer(); if(currentRoute === "/cart") render();
}
function cartCount(){ return cart.reduce((s,l)=>s+l.qty,0); }
function cartSubtotal(){ return cart.reduce((s,l)=>{ const p = getProduct(l.productId); return s + (p ? p.price*l.qty : 0); },0); }

function renderCartBadge(){
  document.getElementById("cartBadge").textContent = cartCount();
}

/* ============================================================
   ORDER LOGIC & WHATSAPP INTEGRATION
   ============================================================ */
let lastOrder = null;

function generateOrderId(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  const rand = String(Math.floor(1000 + Math.random()*9000));
  return `RAAG-${y}${m}${day}-${rand}`;
}

function buildWhatsAppMessage(order){
  let lines = [];
  lines.push("RAAG NEW ORDER");
  lines.push("");
  lines.push(`Order ID: ${order.orderId}`);
  lines.push("");
  lines.push("Customer:");
  lines.push(`Name: ${order.customerName}`);
  lines.push(`Phone: ${order.phone}`);
  if(order.email) lines.push(`Email: ${order.email}`);
  lines.push("");
  lines.push("Order:");
  order.items.forEach(item=>{
    const p = getProduct(item.productId);
    lines.push("");
    lines.push(p ? p.name : item.productId);
    lines.push(`Size: ${item.size}`);
    lines.push(`Quantity: ${item.qty}`);
    if(p) lines.push(`Price: ${formatPrice(p.price)}`);
  });
  lines.push("");
  lines.push("Delivery:");
  lines.push(formatPrice(order.deliveryCharges));
  lines.push("");
  lines.push("Total:");
  lines.push(formatPrice(order.total));
  lines.push("");
  lines.push("Shipping Address:");
  lines.push(order.address);
  lines.push(order.city);
  lines.push(order.province);
  if(order.postalCode) lines.push(order.postalCode);
  lines.push("");
  lines.push("Payment:");
  lines.push("Cash on Delivery");
  return lines.join("\n");
}

function buildWhatsAppUrl(order){
  const msg = buildWhatsAppMessage(order);
  return `https://wa.me/${STORE_CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
}

/* ============================================================
   ROUTER & NAVIGATION ACTIVE STATE
   ============================================================ */
let currentRoute = "/";
let routeParam = null;

function parseHash(){
  let h = window.location.hash.replace(/^#/, "");
  if(!h) h = "/";
  const parts = h.split("/").filter(Boolean);
  return parts;
}

function navigate(){
  const parts = parseHash();
  window.scrollTo(0,0);
  if(parts.length === 0){ currentRoute = "/"; routeParam = null; }
  else if(parts[0] === "product"){ currentRoute = "/product"; routeParam = parts[1]; }
  else if(parts[0] === "admin"){
    if(!adminAuthed){
      window.location.hash = "#/login";
      return;
    }
    currentRoute = "/admin"; routeParam = parts[1] || "dashboard";
  }
  else { currentRoute = "/" + parts[0]; routeParam = parts[1] || null; }

  // Update navbar & mobile-menu active states
  document.querySelectorAll(".nav-link, .mobile-link").forEach(link => {
    const href = link.getAttribute("href");
    const isMatch = (currentRoute === "/" && (href === "#/" || href === "#")) ||
                    (currentRoute !== "/" && href === "#" + currentRoute);
    if (isMatch) {
      link.classList.add("active");
    } else {
      link.classList.remove("active");
    }
  });

  closeMobileMenu();
  render();
}
window.addEventListener("hashchange", navigate);

/* ============================================================
   SMALL UI HELPERS & OVERLAYS
   ============================================================ */
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove("show"), 1800);
}

function openDrawer(){
  document.getElementById("cartDrawer").classList.add("open");
  document.getElementById("drawerBackdrop").classList.add("open");
  renderDrawer();
}
function closeDrawer(){
  document.getElementById("cartDrawer").classList.remove("open");
  document.getElementById("drawerBackdrop").classList.remove("open");

function renderSearchResults(query){
  const q = query.toLowerCase().trim();
  const res = document.getElementById("searchResults");
  if(!q) { res.innerHTML = ""; return; }
  const matches = PRODUCTS.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
  if(matches.length === 0){
    res.innerHTML = `<p class="text-secondary t-body-md mt-md">No products found.</p>`;
    return;
  }
  res.innerHTML = matches.map(p => `
    <a href="#/product/${p.id}" class="search-result-item" onclick="closeSearch()">
      <div class="search-result-thumb">${getProductMediaCart(p)}</div>
      <div>
        <div class="t-body-md" style="text-transform:uppercase;">${p.name}</div>
        <div class="t-price mt-xs">${formatPrice(p.price)}</div>
      </div>

  `).join("");
}

function swapPdpImage(el, idx) {
  document.querySelectorAll(".pdp-thumb").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  const mainImg = document.getElementById("pdpMainImage");
  if (mainImg && currentPdpProduct && currentPdpProduct.images && currentPdpProduct.images[idx]) {
    mainImg.src = currentPdpProduct.images[idx];
  }
}

let pdpSelectedSize = null;
function selectSize(el, size){
  document.querySelectorAll("#sizeRow .size-chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  pdpSelectedSize = size;
  document.getElementById("sizeError").style.display = "none";
}
function pdpQtyChange(delta){
  const el = document.getElementById("pdpQty");
  let q = parseInt(el.dataset.qty,10) + delta;
  if(q < 1) q = 1;
  el.dataset.qty = q;
  el.querySelector("span").textContent = String(q).padStart(2,"0");
}
function toggleAccordion(e, id){
  e.preventDefault();
  document.getElementById(id).classList.toggle("open");
}
function handleAddToBag(productId, andCheckout){
  if(!pdpSelectedSize){
    document.getElementById("sizeError").style.display = "block";
    return;
  }
  const qty = parseInt(document.getElementById("pdpQty").dataset.qty,10);
  addToCart(productId, pdpSelectedSize, qty);
  if(!andCheckout) pdpSelectedSize = null;
}

async function handlePlaceOrder(e){
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());

  let hasError = false;
  ["customerName","phone","address","city","province"].forEach(name=>{
    const input = form.querySelector(`[name="${name}"]`);
    if(!data[name] || !data[name].trim()){
      hasError = true;
      input.style.borderColor = "var(--state-sale)";
    } else {
      input.style.borderColor = "";
    }
  });
  if(hasError){ showToast("Please fill in required fields"); return false; }

  const subtotal = cartSubtotal();
  const delivery = STORE_CONFIG.deliveryCharge;
  const order = {
    orderId: generateOrderId(),
    customerName: data.customerName.trim(),
    phone: data.phone.trim(),
    email: (data.email||"").trim(),
    address: data.address.trim(),
    city: data.city.trim(),
    province: data.province,
    postalCode: (data.postalCode||"").trim(),
    whatsapp: (data.whatsapp||"").trim(),
    notes: (data.notes||"").trim(),
    items: cart.map(l=>({productId:l.productId, size:l.size, qty:l.qty})),
    subtotal, deliveryCharges: delivery, total: subtotal+delivery,
    paymentMethod: "Cash on Delivery",
    createdAt: new Date().toISOString(),
    status: "New"
  };

  const btn = form.querySelector('button[type="submit"]');
  const prevText = btn.textContent;
  btn.textContent = "Placing Order...";
  btn.disabled = true;

  const waTab = window.open('about:blank', '_blank');

  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(order)
    });

    if (!res.ok) throw new Error("API Error");

    if (waTab) waTab.location.href = buildWhatsAppUrl(order);

    lastOrder = order;
    cart = [];
    saveCart();
    renderCartBadge();
    window.location.hash = "#/checkout";
    render();
  } catch (err) {
    if (waTab) waTab.close();
    btn.textContent = prevText;
    btn.disabled = false;
    showToast("Something went wrong. Please try again.");
  }

  return false;
}

    "Total": o.total,
    "Payment Method": o.paymentMethod || "Cash on Delivery",
    "Status": o.status,
    "Date": o.createdAt || o.date || ""
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [
    {wch:20},{wch:20},{wch:14},{wch:22},{wch:28},{wch:14},{wch:12},{wch:40},{wch:10},{wch:16},{wch:12},{wch:12}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Orders");
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `raag-orders-${stamp}.xlsx`);
}

      body: JSON.stringify({ orderId, status })
    });
  } catch(e) {
    showToast("Failed to update status");

}

async function deleteOrder(orderId) {
  if (!confirm(`Delete order ${orderId}? This cannot be undone.`)) return;
  try {
    const res = await fetch('/api/orders?id=' + encodeURIComponent(orderId), { method: 'DELETE' });
    const text = await res.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch (_) {}
    
    if (!res.ok) {
      if (text.includes("METHOD")) throw new Error("Server needs restart to apply API changes.");
      throw new Error(data.error || 'Failed to delete order');
    }
    
    MOCK_ORDERS = MOCK_ORDERS.filter(o => (o.orderId || o.id) !== orderId);
    render();
    showToast('Order deleted');
  } catch(e) {
    showToast(e.message || 'Failed to delete order');
  }
}

    document.getElementById("adminProdPrice").value = "";
    document.getElementById("adminProdStatus").value = "active";
    document.getElementById("adminProdSizes").value = "S, M, L, XL";
    document.getElementById("adminProdOOS").value = "";
  }
}

function closeAdminModal(){
  const backdrop = document.getElementById("adminModalBackdrop");
  const modal = document.getElementById("adminProductModal");
  if(backdrop) backdrop.classList.remove("open");
  if(modal) modal.style.display = "none";
}

let productToDelete = null;
function openDeleteProductModal(id) {
  productToDelete = id;
  if (!document.getElementById("deleteProductModal")) {
    document.body.insertAdjacentHTML('beforeend', `
      <div class="drawer-backdrop" id="deleteModalBackdrop" style="z-index:900;" onclick="closeDeleteProductModal()"></div>
      <div class="admin-modal" id="deleteProductModal" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); width:calc(100% - 2rem); max-width:400px; z-index:901; display:none; flex-direction:column; padding:var(--lg);">
        <h2 class="t-headline-md mb-md">Delete Product?</h2>
        <p class="t-body-sm mb-lg">Delete this product? This action cannot be undone.</p>
        <div style="display:flex; justify-content:flex-end; gap:var(--sm);">
          <button class="btn btn-secondary" onclick="closeDeleteProductModal()">Cancel</button>
          <button class="btn btn-primary" style="background:var(--state-sale);" onclick="confirmDeleteProduct()">Delete</button>
        </div>
      </div>
    `);
  }
  document.getElementById("deleteModalBackdrop").classList.add("open");
  document.getElementById("deleteProductModal").style.display = "flex";
}

function closeDeleteProductModal() {
  const backdrop = document.getElementById("deleteModalBackdrop");
  const modal = document.getElementById("deleteProductModal");
  if(backdrop) backdrop.classList.remove("open");
  if(modal) modal.style.display = "none";
}

async function confirmDeleteProduct() {
  if (!productToDelete) return;
  try {
    const res = await fetch('/api/products?id=' + encodeURIComponent(productToDelete), { method: 'DELETE' });
    const text = await res.text();
    if (!res.ok) {
      let err = 'Failed to delete product';
      try { err = JSON.parse(text).error || err; } catch(_) {}
      throw new Error(err);
    }
    PRODUCTS = PRODUCTS.filter(p => p.id !== productToDelete);
    render();
    showToast("Product deleted");
  } catch (e) {
    showToast(e.message || "Failed to delete product");
  }
  closeDeleteProductModal();
}

async function saveAdminProduct(){
  const name = document.getElementById("adminProdName").value;
  const price = parseInt(document.getElementById("adminProdPrice").value, 10);
  const soldOut = document.getElementById("adminProdStatus").value === "soldout";
  const sizesRaw = document.getElementById("adminProdSizes").value;
  const oosRaw = document.getElementById("adminProdOOS").value;
  
  const sizesArr = sizesRaw ? sizesRaw.split(",").map(s=>s.trim()).filter(Boolean) : ["S","M","L"];
  const oosArr = oosRaw ? oosRaw.split(",").map(s=>s.trim()).filter(Boolean) : [];

  let p = null;
  let isEdit = false;
  
  if(editingProductId){
    p = getProduct(editingProductId);
    if(p) {
      p.name = name || p.name;
      p.price = isNaN(price) ? p.price : price;
      p.soldOut = soldOut;
      p.sizes = sizesArr;
      p.outOfStockSizes = oosArr;
      isEdit = true;
    }
  } else {
    const newId = "prod-" + Math.floor(Math.random()*10000);
    p = {
      id: newId,
      name: name || "New Product",
      category: "Category",
      price: isNaN(price) ? 0 : price,
      compareAt: null,
      glyph: GLYPHS.jacket,
      images: [],
      sizes: sizesArr,
      outOfStockSizes: oosArr,
      bestSeller: false,
      limited: false,
      soldOut: soldOut,
      edition: "DROP 004",
      description: "A new piece added to the collection.",
      details: ["Refined tailoring", "Heavyweight fabric"],
      sizeGuide: "Fits true to size.",
      shipping: "Express shipping.",
      returns: "Standard returns."
    };
    PRODUCTS.unshift(p);
  }
  
  closeAdminModal();
  render();
  
  try {
    const res = await fetch('/api/products', {
      method: isEdit ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(p)
    });
    if (!res.ok) throw new Error("API Error");
    showToast("Changes saved");
  } catch(e) {
    showToast("Failed to save product to database");
  }
}

async function renderAdminCustomers(){
  let custData = [];
  try {
    const res = await fetch("/api/customers");
    if(res.ok) custData = await res.json();
  } catch(e){}

  return `
  <div class="admin-section-head"><h1 class="t-headline-lg">Customers</h1></div>
  <div class="admin-table-wrap"><table class="admin-table">
    <thead><tr><th>Name</th><th>Phone</th><th>City</th><th>Orders</th><th>Spent</th></tr></thead>
    <tbody>
      ${custData.map(c=>`<tr>
        <td>${c.name||"\u2014"}</td>
        <td>${c.phone||"\u2014"}<br><span class="text-tertiary" style="font-size:0.7rem;">${c.email||""}</span></td>
        <td>${c.city||"\u2014"}</td>
        <td>${c.orders||0}</td>
        <td class="t-price">${formatPrice(c.spent||0)}</td>
      </tr>`).join("")}
      ${custData.length===0?'<tr><td colspan="5" style="text-align:center; padding:32px;">No customers yet.</td></tr>':''}
    </tbody>
  </table></div>`;
}

function renderAdminSettings(){
  return `
  <div class="admin-section-head"><h1 class="t-headline-lg">Settings</h1></div>
  <div style="max-width:480px;">
    <div class="field"><label>Store Name</label><input type="text" id="setStoreName" value="${STORE_CONFIG.name}"/></div>
    <div class="field"><label>WhatsApp Number</label><input type="text" id="setStoreWhatsApp" value="${STORE_CONFIG.whatsappDisplay}"/></div>
    <div class="field"><label>Instagram</label><input type="text" id="setStoreInsta" value="${STORE_CONFIG.instagram}"/></div>
    <div class="field"><label>Store Information</label><textarea>Contemporary clothing, made in limited runs. Cash on delivery across Pakistan.</textarea></div>
    <button class="btn btn-primary" onclick="saveAdminSettings()">Save Settings</button>
  </div>`;
}

function saveAdminSettings(){
  STORE_CONFIG.name = document.getElementById("setStoreName").value;
  STORE_CONFIG.whatsappDisplay = document.getElementById("setStoreWhatsApp").value;
  STORE_CONFIG.instagram = document.getElementById("setStoreInsta").value;
  saveConfig();
  showToast("Settings saved locally");
  render();
}

/* ============================================================
   MAIN RENDER DISPATCHER
   ============================================================ */
async function render(){
  const app = document.getElementById("app");
  let html = "";
  let showFooter = true;

  if(currentRoute === "/admin"){
    const parts = parseHash();
    if(parts[1] === "order"){ routeParam = "order"; routeSubParam = parts[2]; }
    html = await renderAdmin();
    showFooter = false;
  }
  else if(currentRoute === "/") html = renderHome();
  else if(currentRoute === "/collection") html = renderCollection();
  else if(currentRoute === "/top-sellers") html = renderTopSellers();
  else if(currentRoute === "/product") html = renderProduct(routeParam);
  else if(currentRoute === "/about") html = renderAbout();
  else if(currentRoute === "/contact") html = renderContact();
  else if(currentRoute === "/cart") html = renderCartPage();
  else if(currentRoute === "/checkout") html = renderCheckout();
  else if(currentRoute === "/login") html = renderLogin();
  else {
    html = `<section class="empty-state" style="min-height:60vh;"><h1 class="t-headline-lg">Page not found</h1><a href="#/" class="btn btn-primary">Back Home</a></section>`;
  }

  app.innerHTML = html + (showFooter ? siteFooter() : "");
  pdpSelectedSize = null;
}

/* ============================================================
   INIT & BOOTSTRAP
   ============================================================ */
async function bootstrap() {
  await loadProducts();
  navigate();
  renderCartBadge();
}

bootstrap();
</script>
